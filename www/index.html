/* premium theme */
:root{--bg:#F5F3EC;--card:#FFFFFF;--ink:#10231A;--mut:#5C6F63;--line:#E7E3D6;--acc:#1F6B45;--onacc:#fff;--soft:#EDEAE0;--gold:#C8963E;--wat:#0B6FA4;--warn:#B45309;--bad:#C0262D}

body{background-image:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--gold) 9%,transparent),transparent);background-repeat:no-repeat;background-attachment:fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin:-12px -14px 14px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
header h1{font-size:21px;letter-spacing:.2px}header small{color:var(--gold);font-weight:600;letter-spacing:.3px}
.lg{box-shadow:0 8px 20px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent)}
.ib{background:color-mix(in srgb,var(--card) 80%,transparent);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.card,.pc,.gc,.ghero{border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:26px;box-shadow:0 1px 1px rgba(16,35,26,.03),0 14px 34px -14px rgba(16,35,26,.16)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .pc,:root[data-theme="dark"] .gc,:root[data-theme="dark"] .ghero{box-shadow:0 14px 34px -14px rgba(0,0,0,.7)}
.pc,.gc{transition:transform .2s ease,box-shadow .2s ease}.pc:hover,.gc:hover{transform:translateY(-3px)}
h2{font-size:17px;letter-spacing:.1px}
.sh{display:flex;align-items:center;font-size:18px}.sh:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--gold);margin-right:10px}
.season{background:linear-gradient(135deg,#1F6B45 0%,#0E3B27 100%);color:#fff;border-radius:32px;padding:22px;box-shadow:0 22px 40px -18px rgba(14,59,39,.7)}

return text}
